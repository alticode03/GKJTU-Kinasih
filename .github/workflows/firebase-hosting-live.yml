name: Deploy to Firebase Hosting on push
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GKJTU_KINASIH }}
          channelId: live
          projectId: gkjtu-kinasih
