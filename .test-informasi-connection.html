<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Koneksi Supabase - Informasi Table</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #C86D51;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }
    .test-section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #f9f9f9;
      border-left: 4px solid #C86D51;
      border-radius: 8px;
    }
    .test-section h2 {
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 1rem;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }
    .status.loading { color: #FF9800; }
    .status.success { color: #4CAF50; }
    .status.error { color: #f44336; }
    .status-icon {
      font-size: 1.2rem;
    }
    .data-display {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #333;
    }
    .error-box {
      background: #ffebee;
      border-left: 4px solid #f44336;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 4px;
      color: #c62828;
    }
    .success-box {
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 4px;
      color: #2e7d32;
    }
    button {
      background: #C86D51;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 1rem;
    }
    button:hover {
      background: #8F432B;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Test Koneksi Supabase - Tabel Informasi</h1>

    <div class="test-section">
      <h2>Status Koneksi</h2>
      <div id="connectionStatus" class="status loading">
        <span class="status-icon">⏳</span>
        <span>Sedang menguji koneksi...</span>
      </div>
      <div id="apiKeyStatus" class="status">
        <span class="status-icon">🔑</span>
        <span>Memeriksa API key...</span>
      </div>
    </div>

    <div class="test-section">
      <h2>Data Tabel Informasi</h2>
      <div id="tableStatus" class="status loading">
        <span class="status-icon">⏳</span>
        <span>Sedang mengambil data...</span>
      </div>
      <div id="recordCount" class="status" style="display: none;">
        <span class="status-icon">📊</span>
        <span id="recordCountText"></span>
      </div>
      <div id="dataDisplay"></div>
    </div>

    <button onclick="retryTest()">🔄 Coba Lagi</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://rqswwfkkqaqphdnygsjw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxc3d3ZmtraWFxcGhkbnlnc2p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjc3NTI4NzAsImV4cCI6MjA0MzMyODg3MH0.TtfLLVKzpW5PW9OjWYRvQ8Jj8SwWAbnkU9-0HGjnI';

    async function testConnection() {
      const connStatus = document.getElementById('connectionStatus');
      const apiKeyStatus = document.getElementById('apiKeyStatus');
      const tableStatus = document.getElementById('tableStatus');
      const dataDisplay = document.getElementById('dataDisplay');
      const recordCount = document.getElementById('recordCount');

      try {
        // Test 1: Basic connection
        connStatus.innerHTML = '<span class="status-icon">⏳</span><span>Menghubungi Supabase...</span>';
        
        const response = await fetch(`${SUPABASE_URL}/rest/v1/informasi?select=*&limit=10`, {
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        // Check API key validity
        if (response.status === 401) {
          apiKeyStatus.innerHTML = '<span class="status-icon">❌</span><span>API key tidak valid atau expired</span>';
          apiKeyStatus.classList.add('error');
          throw new Error('Invalid API key (401)');
        }

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        }

        // Success
        connStatus.innerHTML = '<span class="status-icon">✅</span><span>Koneksi berhasil!</span>';
        connStatus.classList.add('success');
        
        apiKeyStatus.innerHTML = '<span class="status-icon">✅</span><span>API key valid</span>';
        apiKeyStatus.classList.add('success');

        const data = await response.json();
        
        // Display data
        tableStatus.innerHTML = '<span class="status-icon">✅</span><span>Tabel informasi berhasil diakses</span>';
        tableStatus.classList.add('success');

        recordCount.style.display = 'flex';
        document.getElementById('recordCountText').textContent = `${data.length} record ditemukan`;

        if (data.length > 0) {
          let html = '<div class="success-box"><strong>✅ Tabel exists dan berisi data:</strong></div>';
          html += '<div class="data-display"><pre>';
          data.forEach((record, idx) => {
            html += `Record ${idx + 1}:\n`;
            html += `  ID: ${record.id}\n`;
            html += `  Date: ${record.date}\n`;
            html += `  Title: ${record.title}\n`;
            html += `  Content: ${record.content.substring(0, 60)}${record.content.length > 60 ? '...' : ''}\n`;
            html += `  Created: ${record.created_at}\n\n`;
          });
          html += '</pre></div>';
          dataDisplay.innerHTML = html;
        } else {
          dataDisplay.innerHTML = '<div class="success-box"><strong>✅ Tabel exists tapi kosong</strong> - Siap untuk menambahkan data</div>';
        }

      } catch (error) {
        connStatus.innerHTML = '<span class="status-icon">❌</span><span>Koneksi gagal</span>';
        connStatus.classList.add('error');
        
        dataDisplay.innerHTML = `<div class="error-box"><strong>Error:</strong> ${error.message}</div>`;
        console.error('Test failed:', error);
      }
    }

    function retryTest() {
      document.getElementById('connectionStatus').className = 'status loading';
      document.getElementById('connectionStatus').innerHTML = '<span class="status-icon">⏳</span><span>Sedang menguji koneksi...</span>';
      document.getElementById('apiKeyStatus').className = 'status';
      document.getElementById('apiKeyStatus').innerHTML = '<span class="status-icon">🔑</span><span>Memeriksa API key...</span>';
      document.getElementById('tableStatus').className = 'status loading';
      document.getElementById('tableStatus').innerHTML = '<span class="status-icon">⏳</span><span>Sedang mengambil data...</span>';
      document.getElementById('dataDisplay').innerHTML = '';
      testConnection();
    }

    // Run test on page load
    window.addEventListener('load', testConnection);
  </script>
</body>
</html>
