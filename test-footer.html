<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <title>Test Footer Visibility</title>
  <style>
    body { margin: 0; font-family: Arial; }

</head>

      <div class="footer-col"><h3>GKJTU Kinasih</h3><p>Tempat beribadah</p></div>
      <div class="footer-col"><h4>Menu</h4><p>Link menu</p></div>
      <div class="footer-col"><h4>Sosial</h4><p>Social links</p></div>
      <div class="footer-col"><h4>Lokasi</h4><p>Alamat</p></div>
    </div>
    <div style="text-align: center; border-top: 1px solid rgba(255,242,237,0.15); padding-top: 2rem;">
      © 2026 KPK GKJTU Kinasih
    </div>

</html>
